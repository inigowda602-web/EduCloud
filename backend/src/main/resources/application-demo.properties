# DEMO PROFILE — runs entirely in memory (H2), no MySQL needed.
# Start with:  mvn spring-boot:run "-Dspring-boot.run.profiles=demo"
# Data is re-seeded on every start and disappears when the app stops.
spring.datasource.url=jdbc:h2:mem:educloud;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.seed.enabled=true
