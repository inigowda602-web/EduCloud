spring.application.name=educloud-backend

# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# ---------------------------------------------------------------------
# MySQL / JPA
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:educloud}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Must stay true: services map lazy relations (student.getUser(), etc.) to DTOs outside a transaction.
spring.jpa.open-in-view=true

# Sample data is seeded by DataSeeder.java (a CommandLineRunner), not data.sql —
# generating ~800 correctly-linked relational rows by hand in SQL is exactly the
# kind of thing that silently drifts out of sync with the schema. See
# src/main/resources/data.sql for a short note, and DataSeeder.java for the real seeding logic.
spring.sql.init.mode=never
app.seed.enabled=${SEED_ENABLED:true}

# ---------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------
# IMPORTANT: override JWT_SECRET in your real .env — never use the default
# in anything beyond local development. Must be a Base64-safe string of at
# least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-please-replace-me-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------
# Mail (Spring Boot Mail)
# ---------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@educloud.local}
# When true, email failures are logged instead of throwing — handy for local
# dev when SMTP credentials aren't configured yet.
app.mail.fail-silently=${MAIL_FAIL_SILENTLY:true}

# ---------------------------------------------------------------------
# Frontend / password reset link
# ---------------------------------------------------------------------
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ---------------------------------------------------------------------
# Gemini AI (backend-only — never exposed to the frontend)
# ---------------------------------------------------------------------
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
app.gemini.api-base=${GEMINI_API_BASE:https://generativelanguage.googleapis.com/v1beta}

# ---------------------------------------------------------------------
# File uploads (assignment submissions, course materials)
# ---------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.com.educloud=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
