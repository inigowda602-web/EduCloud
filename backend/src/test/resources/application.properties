# Test-only config: in-memory H2 instead of MySQL, schema created fresh each run,
# sample-data seeding disabled so tests control their own fixtures exactly.
spring.datasource.url=jdbc:h2:mem:educloud_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.seed.enabled=false

app.jwt.secret=test-only-secret-key-not-for-production-use-1234567890
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
app.mail.from=test@educloud.local
app.mail.fail-silently=true

app.frontend.base-url=http://localhost:5173

app.gemini.api-key=
app.gemini.model=gemini-1.5-flash
app.gemini.api-base=https://generativelanguage.googleapis.com/v1beta

app.upload.dir=./test-uploads
